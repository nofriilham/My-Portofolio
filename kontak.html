<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#1f5f7a" />
    <script type="module" src="js/main.js" defer></script>
    <title>Kontak</title>
  </head>

  <body>
    <header class="site-header">
      <nav aria-label="Navigasi utama">
        <button type="button" id="tombol-tema" aria-pressed="false">
          Ganti tema
        </button>
        <a href="index.html">Beranda</a>
        <a href="profil.html">Profil</a>
        <a href="kontak.html">Kontak</a>
      </nav>
      <a href="kontak.html" class="logo" aria-label="Beranda">
        <img src="icons/icon-512x512.png" alt="" />
      </a>
    </header>

    <main>
      <section class="kontak-saya">
        <h1>Kontak Saya</h1>
        <form novalidate>
          <p>
            <label for="nama">Nama:</label><br />
            <input
              type="text"
              id="nama"
              name="nama"
              required
              aria-describedby="error-nama"
            />
            <span class="error" id="error-nama" role="alert"></span>
          </p>
          <p>
            <label for="email">Email:</label><br />
            <input
              type="email"
              id="email"
              name="email"
              required
              aria-describedby="error-email"
            />
            <span class="error" id="error-email" role="alert"></span>
          </p>
          <p>
            <label for="topik">Topik:</label><br />
            <select
              id="topik"
              name="topik"
              required
              aria-describedby="error-topik"
            >
              <option value="">---Pilih Opsi---</option>
              <option value="pertanyaan">Pertanyaan</option>
              <option value="saran">Saran</option>
              <option value="kritik">Kritik</option>
            </select>
            <span class="error" id="error-topik" role="alert"></span>
          </p>

          <p>
            <label for="saran">Saran: </label><br />
            <textarea
              id="pesan"
              name="pesan"
              required
              aria-describedby="error-pesan"
            ></textarea>
            <span class="error" id="error-pesan" role="alert"></span>
          </p>

          <p>
            <button type="submit">Kirim</button>
          </p>
          <p id="status-form" role="status"></p>
        </form>
      </section>
      <section class="social-media">
        <h2>Mari Terhubung!</h2>

        <p>
          Punya pertanyaan, ingin berdiskusi, atau tertarik bekerja sama?
          Hubungi saya melalui media sosial berikut.
        </p>

        <div class="social-links">
          <a
            href="https://www.instagram.com/nfrilhm/"
            target="_blank"
            rel="noopener noreferrer"
            class="social-btn instagram"
          >
            Instagram ↗
          </a>

          <a
            href="https://wa.me/6283193093967"
            target="_blank"
            rel="noopener noreferrer"
            class="social-btn whatsapp"
          >
            WhatsApp ↗
          </a>
        </div>
      </section>
    </main>
    <footer>
      <p>&copy; 2026 Nofri Ilham</p>
    </footer>
  </body>
</html>
